<style>
  :root {
    --ink: #1B1812;
    --ink-soft: #4B453C;
    --paper: #F3EFE7;
    --paper-2: #E7E0D2;
    --wine: #6E2A38;
    --wine-light: #893447;
    --gold: #B99A4F;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { max-width: 100vw; background: var(--paper); color: var(--ink); font-family: var(--body); line-height: 1.65; margin: 0; padding: 0; }

  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  ::selection { background: var(--gold); color: var(--ink); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 5vw; }

  /* Nav Links Styling & Gold Underline Effect */
  .nav-links { 
    display: flex; 
    align-items: center; 
    gap: 1.15rem; 
    font-size: 0.94rem; 
    font-weight: 500; 
    white-space: nowrap; 
  }
  .nav-links a {
    position: relative;
    padding-bottom: 4px;
    color: var(--ink) !important;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .nav-links a:hover,
  .nav-links a.active {
    color: var(--ink) !important;
    font-weight: 600;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 0;
    height: 2px;
    background-color: var(--gold);
    transition: width 0.25s ease-in-out;
  }
  .nav-links a:hover::after, 
  .nav-links a.active::after {
    width: 100%;
  }

  /* Accessible Buttons */
  .btn {
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    gap: 0.5rem;
    padding: 1rem 2.2rem;
    min-width: 170px;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.03em; 
    border-radius: 4px; 
    text-decoration: none; 
    box-sizing: border-box; 
    transition: transform 0.18s, background 0.18s, color 0.18s, border-color 0.18s;
  }
  .btn-gold { background: var(--gold); color: var(--ink); }
  .btn-gold:hover { background: #cbae6c; transform: translateY(-2px); }

  /* Page Content Styles */
  .holiday-band { background: var(--ink); color: var(--paper); padding: 4rem 0; }
  .holiday-band .eyebrow { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem; }
  .holiday-band h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2.2rem, 5vw, 3.2rem); color: var(--paper); margin-bottom: 1.1rem; line-height: 1.15; }
  .holiday-band p { font-size: 1.12rem; color: #CFC8B9; line-height: 1.75; max-width: 860px; margin: 0 auto; text-align: center; }
